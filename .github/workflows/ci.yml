name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PHP runs directly on the GitHub-hosted runner. The Docker-only PHP rule in
      # CLAUDE.md applies to the local development machine, which has no PHP binary.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint first-party PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(
            find \
              wp-content/themes/pgds \
              wp-content/plugins/pgds-lunar-calendar \
              wp-content/mu-plugins \
              tools/tests \
              -type f -name '*.php' -print0
          )
          [ "${#php_files[@]}" -gt 0 ] || {
            echo "::error::no first-party PHP files found"
            exit 1
          }
          printf '%s\0' "${php_files[@]}" | xargs -0 -n 1 php -l

  test-release-deploy:
    name: Test release deployment boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test helper installation and key migration
        run: infra/tests/test-install-pgds-deploy-helper.sh

      - name: Test release validation, promotion, and rollback
        run: infra/tests/test-pgds-deploy-release.sh

  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Lint JavaScript
        working-directory: wp-content/themes/pgds
        run: npm run lint:js

  test-cms-editor:
    name: Test WordPress workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test static release contracts
        run: bash tools/tests/release-contract-regression.sh

      - name: Boot WordPress and run isolated editor checks
        shell: bash
        run: |
          set -euo pipefail
          cd infra/local
          docker compose up -d
          ./sync.sh
          docker compose run --rm wpcli /var/www/html/.pgds-scripts/setup.sh
          docker compose run --rm wpcli /var/www/html/.pgds-tools/tests/cms-editor-regression.sh
          docker compose run --rm wpcli /var/www/html/.pgds-tools/tests/compatibility-regression.sh

      - name: Remove test containers and volumes
        if: always()
        shell: bash
        run: |
          cd infra/local
          docker compose down --volumes --remove-orphans

  synapse-sca:
    name: Synapse SCA security scan (evaluation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan dependencies and source
        id: synapse
        # Pin the action to its v0.2.1 commit and use the matching CLI release.
        uses: KKloudTarus/synapse-ce@0613b8b7950554cd0a9fb54e1484991d6f1b93ea # v0.2.1
        with:
          path: .
          fail-on: high
          sarif: true
          version: v0.2.1
        continue-on-error: true

      - name: Save Synapse findings
        if: always()
        id: synapse-report
        uses: actions/upload-artifact@v4
        with:
          name: synapse-sarif
          path: synapse.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Summarize Synapse findings
        if: always()
        shell: bash
        env:
          SYNAPSE_OUTCOME: ${{ steps.synapse.outcome }}
          SYNAPSE_REPORT_URL: ${{ steps.synapse-report.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [ -s synapse.sarif ] || {
            echo "::error::Synapse did not produce a SARIF report"
            exit 1
          }
          jq -e '.version == "2.1.0" and (.runs | type == "array")' synapse.sarif >/dev/null
          {
            echo '### Synapse security scan (evaluation)'
            echo
            echo "Scanner step: ${SYNAPSE_OUTCOME}. Findings are advisory during evaluation."
            echo
            echo '| Severity | Findings |'
            echo '| --- | ---: |'
            for severity in critical high medium low info; do
              count="$(jq --arg severity "$severity" '[.runs[].results[] | select(.properties.severity == $severity)] | length' synapse.sarif)"
              echo "| ${severity} | ${count} |"
            done
            echo
            echo '#### Critical and high findings'
            for severity in critical high; do
              jq -r --arg severity "$severity" '
                .runs[].results[]
                | select(.properties.severity == $severity)
                | "- **\($severity)** \(.message.text | gsub("[\\r\\n]"; " "))"
              ' synapse.sarif
            done
            echo
            if [ -n "$SYNAPSE_REPORT_URL" ]; then
              echo "[Download full SARIF report](${SYNAPSE_REPORT_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-evaluation:
    name: Trivy security scan (evaluation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan dependencies, configuration, and secrets
        # Pin trivy-action v0.36.0 and the Trivy CLI release independently.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: json
          output: trivy.json
          exit-code: "0"
          version: v0.74.0
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Show Trivy summary and create SARIF
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --format table --report summary --scanners vuln,misconfig,secret trivy.json
          trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Save Trivy findings
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy.json
            trivy.sarif
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build theme assets
    needs:
      - lint-php
      - lint-js
      - test-release-deploy
      - test-cms-editor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Verify built assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';

          const dist = 'wp-content/themes/pgds/assets/dist';
          const manifestPath = `${dist}/manifest.json`;

          if (!existsSync(manifestPath)) {
            throw new Error('Build did not create assets/dist/manifest.json.');
          }

          let manifest;
          try {
            manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          } catch (error) {
            throw new Error(`assets/dist/manifest.json is invalid JSON: ${error.message}`);
          }

          const files = readdirSync(dist);
          const required = [
            ['main CSS', /^main\.[a-f0-9]{8}\.css$/],
            ['app JavaScript', /^app\.[a-f0-9]{8}\.js$/],
          ];

          for (const [label, pattern] of required) {
            if (!files.some((file) => pattern.test(file))) {
              throw new Error(`Build did not create a hashed ${label} file.`);
            }
          }

          for (const key of ['main.css', 'app.js']) {
            if (typeof manifest[key] !== 'string' || !files.includes(manifest[key])) {
              throw new Error(`Manifest entry ${key} is missing or does not reference a built file.`);
            }
          }
          NODE

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgds-assets-dist
          path: wp-content/themes/pgds/assets/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload self-hosted fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgds-fonts
          path: wp-content/themes/pgds/assets/fonts/*.woff2
          if-no-files-found: error
          retention-days: 7
