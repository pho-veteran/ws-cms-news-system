name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PHP runs directly on the GitHub-hosted runner. The Docker-only PHP rule in
      # CLAUDE.md applies to the local development machine, which has no PHP binary.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint first-party PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(
            find \
              wp-content/themes/pgds \
              wp-content/plugins/pgds-lunar-calendar \
              wp-content/mu-plugins \
              -type f -name '*.php' -print0
          )
          [ "${#php_files[@]}" -gt 0 ] || {
            echo "::error::no first-party PHP files found"
            exit 1
          }
          printf '%s\0' "${php_files[@]}" | xargs -0 -n 1 php -l

  test-release-deploy:
    name: Test release deployment boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test helper installation and key migration
        run: infra/tests/test-install-pgds-deploy-helper.sh

      - name: Test release validation, promotion, and rollback
        run: infra/tests/test-pgds-deploy-release.sh

  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Lint JavaScript
        working-directory: wp-content/themes/pgds
        run: npm run lint:js

  build:
    name: Build theme assets
    needs:
      - lint-php
      - lint-js
      - test-release-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Verify built assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';

          const dist = 'wp-content/themes/pgds/assets/dist';
          const manifestPath = `${dist}/manifest.json`;

          if (!existsSync(manifestPath)) {
            throw new Error('Build did not create assets/dist/manifest.json.');
          }

          let manifest;
          try {
            manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          } catch (error) {
            throw new Error(`assets/dist/manifest.json is invalid JSON: ${error.message}`);
          }

          const files = readdirSync(dist);
          const required = [
            ['main CSS', /^main\.[a-f0-9]{8}\.css$/],
            ['app JavaScript', /^app\.[a-f0-9]{8}\.js$/],
          ];

          for (const [label, pattern] of required) {
            if (!files.some((file) => pattern.test(file))) {
              throw new Error(`Build did not create a hashed ${label} file.`);
            }
          }

          for (const key of ['main.css', 'app.js']) {
            if (typeof manifest[key] !== 'string' || !files.includes(manifest[key])) {
              throw new Error(`Manifest entry ${key} is missing or does not reference a built file.`);
            }
          }
          NODE

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgds-assets-dist
          path: wp-content/themes/pgds/assets/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload self-hosted fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgds-fonts
          path: wp-content/themes/pgds/assets/fonts/*.woff2
          if-no-files-found: error
          retention-days: 7
