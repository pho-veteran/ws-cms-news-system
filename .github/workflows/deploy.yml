name: Deploy WordPress runtime

on:
  push:
    branches:
      - main
  # Manual re-run without an empty commit. Every run gets a distinct immutable
  # release ID, while promotion and cache invalidation keep the same fixed boundaries.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgds-production-deploy
  cancel-in-progress: false

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PHP runs directly on the GitHub-hosted runner. The Docker-only PHP rule in
      # CLAUDE.md applies to the local development machine, which has no PHP binary.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint first-party PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(
            find \
              wp-content/themes/pgds \
              wp-content/plugins/pgds-lunar-calendar \
              wp-content/mu-plugins \
              -type f -name '*.php' -print0
          )
          [ "${#php_files[@]}" -gt 0 ] || {
            echo "::error::no first-party PHP files found"
            exit 1
          }
          printf '%s\0' "${php_files[@]}" | xargs -0 -n 1 php -l

  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Lint JavaScript
        working-directory: wp-content/themes/pgds
        run: npm run lint:js

  build:
    name: Build theme assets
    needs:
      - lint-php
      - lint-js
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Verify built assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';

          const dist = 'wp-content/themes/pgds/assets/dist';
          const manifestPath = `${dist}/manifest.json`;

          if (!existsSync(manifestPath)) {
            throw new Error('Build did not create assets/dist/manifest.json.');
          }

          let manifest;
          try {
            manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          } catch (error) {
            throw new Error(`assets/dist/manifest.json is invalid JSON: ${error.message}`);
          }

          const files = readdirSync(dist);
          const required = [
            ['main CSS', /^main\.[a-f0-9]{8}\.css$/],
            ['app JavaScript', /^app\.[a-f0-9]{8}\.js$/],
          ];

          for (const [label, pattern] of required) {
            if (!files.some((file) => pattern.test(file))) {
              throw new Error(`Build did not create a hashed ${label} file.`);
            }
          }

          for (const key of ['main.css', 'app.js']) {
            if (typeof manifest[key] !== 'string' || !files.includes(manifest[key])) {
              throw new Error(`Manifest entry ${key} is missing or does not reference a built file.`);
            }
          }
          NODE

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # id-token is what lets this job exchange a GitHub OIDC token for the AWS role in
    # infra/terraform/main/github-oidc.tf. Without it the AWS step fails with
    # "Credentials could not be loaded"; with it, no long-lived AWS key exists in GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Configure deploy SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------------------
      # Temporary SSH access for this runner only.
      #
      # §10.2 restricts SSH ingress to one administrator CIDR, and a GitHub-hosted runner
      # is never at that address. The first real deploy proved it:
      #   ssh: connect to host *** port 22: Connection timed out
      #
      # Allow-listing GitHub's ranges is not an option — https://api.github.com/meta lists
      # 5,625 IPv4 ranges for `actions`, against AWS's default 60 rules per security group.
      # Opening 0.0.0.0/0 would throw away the §10.2 control outright.
      #
      # So the job opens a /32 for its own address, deploys, and revokes it in an always()
      # step below. Credentials come from OIDC (see infra/terraform/main/github-oidc.tf),
      # so no long-lived AWS key is stored in GitHub, and the role can do nothing but
      # authorize/revoke ingress on this one security group.
      # ---------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open SSH for this runner
        id: open_ssh
        shell: bash
        env:
          SG_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          # A previous job can be killed after authorizing ingress but before its always()
          # cleanup runs. Deploys are serialized, so no matching rule can belong to another
          # active deploy; remove any legacy leak before opening this run's rule.
          STALE_RULE_IDS="$(
            aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${SG_ID}" \
              --query "SecurityGroupRules[?IsEgress==\`false\` && FromPort==\`22\` && ToPort==\`22\` && (Description=='github-actions temporary deploy access' || starts_with(Description || '', 'github-actions deploy '))].SecurityGroupRuleId" \
              --output text
          )"
          for rule_id in $STALE_RULE_IDS; do
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" \
              --security-group-rule-ids "$rule_id" \
              >/dev/null
            echo "removed stale temporary SSH rule ${rule_id}"
          done

          # api.ipify.org is a plain-text echo; checkip.amazonaws.com is the fallback so a
          # single provider outage cannot block a deploy. Force IPv4 because this workflow
          # deliberately authorizes an IPv4 /32 and the origin has no public IPv6 address.
          RUNNER_IP="$(
            { curl -4fsS --max-time 15 https://api.ipify.org || \
              curl -4fsS --max-time 15 https://checkip.amazonaws.com; } |
              tr -d '[:space:]'
          )"
          if ! python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit(f"expected an IPv4 address, got {address}")
          PY
          then
            echo "could not determine the runner's public IPv4 address" >&2
            exit 1
          fi

          RUNNER_CIDR="${RUNNER_IP}/32"
          RULE_DESCRIPTION="github-actions deploy ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "runner_cidr=${RUNNER_CIDR}" >> "$GITHUB_OUTPUT"
          echo "rule_description=${RULE_DESCRIPTION}" >> "$GITHUB_OUTPUT"

          RULE_ID="$(
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_CIDR},Description='${RULE_DESCRIPTION}'}]" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text
          )"
          if [[ ! "$RULE_ID" =~ ^sgr-[0-9a-f]+$ ]]; then
            echo "AWS did not return the temporary security-group rule ID" >&2
            exit 1
          fi
          echo "rule_id=${RULE_ID}" >> "$GITHUB_OUTPUT"
          echo "opened 22 for ${RUNNER_CIDR} as ${RULE_ID}"

      # ---------------------------------------------------------------------
      # The only remote path assembled from a secret is the SSH target. Runtime
      # destinations, ownership, service names, and cache paths are fixed inside the
      # root-owned promotion helper, so CI cannot redirect a privileged copy or purge.
      # DEPLOY_USER remains the existing broad-sudo account only for the one-time,
      # idempotent migration; all release operations use fixed user pgds-deploy.
      # ---------------------------------------------------------------------
      - name: Validate deploy target secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          LEGACY_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          fail=0
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::DEPLOY_HOST is not a bare hostname or IPv4 address"
            fail=1
          fi
          if [[ ! "$LEGACY_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER is not a plain POSIX user name"
            fail=1
          fi
          if [ "$LEGACY_DEPLOY_USER" = pgds-deploy ]; then
            echo "::error::DEPLOY_USER must remain the legacy bootstrap account, not pgds-deploy"
            fail=1
          fi
          exit "$fail"

      # Replacement hosts receive this account and helper from Terraform user_data.
      # Existing hosts are migrated once through the prior account: install the same
      # derived public key under pgds-deploy, validate the restricted sudo policy, then
      # retire only that exact key from the legacy account. No WordPress data is touched.
      - name: Ensure restricted deployment account
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          LEGACY_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          SCP=(scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          RESTRICTED_USER=pgds-deploy

          probe_output="$("${SSH[@]}" "${RESTRICTED_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/pgds-deploy-release bootstrap-probe" 2>&1 || true)"
          restricted_ready=0
          if grep -Fq 'staged release does not exist: bootstrap-probe' <<< "$probe_output"; then
            restricted_ready=1
          fi

          public_key_file="$RUNNER_TEMP/pgds-deploy.pub"
          bootstrap_dir="pgds-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bootstrap_remote="/tmp/$bootstrap_dir"
          ssh-keygen -y -f ~/.ssh/id_ed25519 \
            | awk 'NR == 1 { print $1, $2, "github-actions-pgds" }' \
            > "$public_key_file"
          chmod 600 "$public_key_file"

          if [ "$restricted_ready" -eq 1 ]; then
            remote_key_blob="$("${SSH[@]}" "${RESTRICTED_USER}@${DEPLOY_HOST}" \
              "awk 'NR == 1 { print \$2 }' ~/.ssh/authorized_keys")"
            expected_key_blob="$(awk '{ print $2 }' "$public_key_file")"
            [ "$remote_key_blob" = "$expected_key_blob" ] \
              || { echo '::error::pgds-deploy is configured with a different key'; exit 1; }

            if ! "${SSH[@]}" -o ConnectTimeout=5 \
              "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}" true >/dev/null 2>&1; then
              echo "restricted deployment account is ready and legacy CI access is retired"
              exit 0
            fi
            echo "restricted account is ready; retiring remaining legacy CI access"
          fi

          "${SSH[@]}" "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; umask 077; rm -rf -- '$bootstrap_remote'; mkdir -- '$bootstrap_remote'"
          trap '"${SSH[@]}" "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}" "rm -rf -- '\''$bootstrap_remote'\''" >/dev/null 2>&1 || true' EXIT
          "${SCP[@]}" \
            infra/scripts/install-pgds-deploy-helper.sh \
            infra/scripts/pgds-deploy-release \
            "$public_key_file" \
            "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}:${bootstrap_remote}/"
          "${SSH[@]}" "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; sudo -n env PGDS_AUTHORIZED_KEYS_SOURCE='${bootstrap_remote}/pgds-deploy.pub' PGDS_RETIRE_KEY_FROM_USER='${LEGACY_DEPLOY_USER}' bash '${bootstrap_remote}/install-pgds-deploy-helper.sh' '${bootstrap_remote}/pgds-deploy-release'; rm -rf -- '$bootstrap_remote'"
          trap - EXIT

          probe_output="$("${SSH[@]}" "${RESTRICTED_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/pgds-deploy-release bootstrap-probe" 2>&1 || true)"
          grep -Fq 'staged release does not exist: bootstrap-probe' <<< "$probe_output" \
            || { printf '%s\n' "$probe_output" >&2; echo '::error::restricted deployment account verification failed'; exit 1; }
          if "${SSH[@]}" -o ConnectTimeout=5 "${LEGACY_DEPLOY_USER}@${DEPLOY_HOST}" true >/dev/null 2>&1; then
            echo "::error::the CI key still authenticates to the legacy broad-sudo account"
            exit 1
          fi
          echo "restricted deployment account installed and legacy CI key retired"

      # Build one self-contained first-party runtime package. Theme build sources and
      # toolchain files are excluded; generated assets/dist remains in the payload.
      # The manifest uses paths relative to the release root and covers every payload
      # file, which lets the privileged helper reject omissions, additions, or tampering.
      - name: Package staged release
        id: release
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/pgds-release/$RELEASE_ID"
          install -d \
            "$RELEASE_ROOT/theme/pgds" \
            "$RELEASE_ROOT/plugins/pgds-lunar-calendar" \
            "$RELEASE_ROOT/mu-plugins"

          rsync -a --delete \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='tools/' \
            --exclude='build.mjs' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='eslint.config.mjs' \
            --exclude='README.md' \
            wp-content/themes/pgds/ \
            "$RELEASE_ROOT/theme/pgds/"
          rsync -a --delete \
            wp-content/plugins/pgds-lunar-calendar/ \
            "$RELEASE_ROOT/plugins/pgds-lunar-calendar/"
          install -m 0644 \
            wp-content/mu-plugins/pgds-cache-flush.php \
            wp-content/mu-plugins/pgds-lunar-loader.php \
            "$RELEASE_ROOT/mu-plugins/"

          (
            cd "$RELEASE_ROOT"
            mapfile -d '' payload_files < <(
              find theme plugins mu-plugins -type f -print0 | LC_ALL=C sort -z
            )
            [ "${#payload_files[@]}" -gt 0 ] || {
              echo "::error::release payload contains no files"
              exit 1
            }
            printf '%s\0' "${payload_files[@]}" | xargs -0 sha256sum > MANIFEST.sha256
          )
          tar -C "$(dirname "$RELEASE_ROOT")" -czf "$RUNNER_TEMP/${RELEASE_ID}.tar.gz" "$RELEASE_ID"
          {
            echo "id=$RELEASE_ID"
            echo "archive=$RUNNER_TEMP/${RELEASE_ID}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      # Upload only into the unprivileged account's fixed incoming directory. The
      # archive is extracted into a private temporary directory and renamed atomically,
      # so a failed transfer or extraction never leaves a reusable partial release.
      - name: Upload staged release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: pgds-deploy
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          REMOTE_ARCHIVE="/var/lib/pgds-deploy/incoming/.${RELEASE_ID}.tar.gz"

          "${SCP[@]}" "$RELEASE_ARCHIVE" "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ARCHIVE}"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_ID='${RELEASE_ID}' REMOTE_ARCHIVE='${REMOTE_ARCHIVE}' bash -s" <<'REMOTE'
          set -euo pipefail
          incoming=/var/lib/pgds-deploy/incoming
          partial="$incoming/.extract-${RELEASE_ID}"
          trap 'rm -f -- "$REMOTE_ARCHIVE"; rm -rf -- "$partial"' EXIT
          cd "$incoming"
          [ ! -e "$RELEASE_ID" ] || { echo "release ID already exists" >&2; exit 1; }
          rm -rf -- "$partial"
          install -d -m 0700 "$partial"
          tar --extract --gzip --file "$REMOTE_ARCHIVE" --directory "$partial" \
            --strip-components=1 --no-same-owner --no-same-permissions
          mv -- "$partial" "$RELEASE_ID"
          REMOTE

      # One exact sudo grant replaces broad write access to WordPress and the prior
      # general systemctl/find grants. The root-owned helper validates checksums, PHP,
      # and asset references; takes the deploy lock; promotes only the fixed theme,
      # plugin, and two mu-plugin destinations; reloads FPM; then flushes origin cache.
      - name: Promote release at origin
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: pgds-deploy
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/pgds-deploy-release '${RELEASE_ID}'"

      # Purge the origin before the edge. Purging Cloudflare first can re-cache stale
      # origin content at the edge, so only purge it after PHP-FPM and FastCGI are fresh.
      # Detect asset changes from the SOURCES, not from assets/.
      #
      # `git diff -- wp-content/themes/pgds/assets/` could not work: assets/dist/* is
      # gitignored (see .gitignore), so exactly ONE file is tracked under assets/ —
      # fonts/README.md. The condition was therefore false on essentially every deploy and
      # the edge purge below never ran, which is the one step that makes a new
      # [contenthash] filename reachable through Cloudflare.
      #
      # The sources that determine the built output are the SCSS/JS under src/, the build
      # script, and the dependency lockfile (a dart-sass or esbuild bump changes the
      # output). Comparing those is also more accurate than comparing the artefacts: the
      # hash changes if and only if the input did.
      #
      # `git diff --quiet` exits 1 when there are differences, which `set -e` would treat
      # as a failure, hence the explicit `if`.
      - name: Detect asset changes
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=(
            "wp-content/themes/pgds/src"
            "wp-content/themes/pgds/build.mjs"
            "wp-content/themes/pgds/package.json"
            "wp-content/themes/pgds/package-lock.json"
            "wp-content/themes/pgds/tools/fetch-fonts.mjs"
            "wp-content/themes/pgds/assets/fonts"
          )
          # A manual re-run has no new commit to diff against, and the reason to trigger
          # one is usually "the edge is serving something stale". Purge unconditionally.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual dispatch; purging the edge"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the full pushed commit range rather than only HEAD^..HEAD. A multi-
          # commit push can change assets in an earlier commit while leaving the tip's
          # direct parent diff clean.
          BEFORE="${{ github.event.before }}"
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "push base unavailable; assuming assets changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- "${SOURCES[@]}"; then
            echo "asset sources unchanged; skipping edge purge"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "asset sources changed:"
            git diff --name-only "$BEFORE" HEAD -- "${SOURCES[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare when assets changed
        if: steps.assets.outputs.changed == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          # Cloudflare answers a rejected purge with HTTP 200 and "success": false, so
          # --fail-with-body alone would let a silently unpurged edge pass as a green
          # deploy. Capture the body and assert the flag.
          RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"purge_everything":true}'
          )"
          if ! printf '%s' "$RESPONSE" | jq -e '.success == true' >/dev/null; then
            # The body carries an errors[] array, never the token.
            echo "::error::Cloudflare purge did not succeed: $(printf '%s' "$RESPONSE" | jq -c '.errors // .')"
            exit 1
          fi
          echo "edge purged"

      # ---------------------------------------------------------------------
      # Post-deploy smoke test through the edge.
      #
      # Every step above can succeed while the site itself is broken: a fatal in deployed
      # PHP returns 500, and a missing plugin returns 404 on its own route while the
      # homepage stays 200. That is precisely how the lunar plugin's absence went
      # unnoticed. These checks run against the public hostname, after both purges, so
      # they assert what a visitor actually receives.
      # ---------------------------------------------------------------------
      - name: Smoke test production
        shell: bash
        env:
          SITE_URL: https://vihn.id.vn
        run: |
          set -euo pipefail

          fail=0

          check_status() {
            local path="$1" expected="$2"
            local code
            # Cache-Control: no-cache asks Cloudflare for an origin response rather than
            # confirming its own cache is warm.
            code="$(
              curl --silent --show-error --location \
                --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
                --header 'Cache-Control: no-cache' \
                --output /dev/null --write-out '%{http_code}' \
                "${SITE_URL}${path}"
            )"
            if [ "$code" != "$expected" ]; then
              echo "::error::${path} returned ${code}, expected ${expected}"
              fail=1
            else
              echo "${path} -> ${code}"
            fi
          }

          check_status / 200
          check_status /wp-json/pgds-lunar/v1/today 200

          # The lunar route must return usable data, not just 200 with an empty body.
          LUNAR="$(
            curl --silent --show-error --location --max-time 30 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              "${SITE_URL}/wp-json/pgds-lunar/v1/today"
          )"
          if ! printf '%s' "$LUNAR" | jq -e '(.lunar_day | type == "string" and length > 0) and (.menh | type == "string" and length > 0)' >/dev/null; then
            echo "::error::lunar endpoint returned unexpected payload: $(printf '%s' "$LUNAR" | head -c 300)"
            fail=1
          else
            echo "lunar payload: $(printf '%s' "$LUNAR" | jq -c '{lunar_day, menh}')"
          fi

          # The hashed asset filenames just built must be reachable at the edge. This is
          # the check that would have caught a purge that silently did nothing.
          MANIFEST="wp-content/themes/pgds/assets/dist/manifest.json"
          for key in main.css app.js; do
            asset="$(jq -r --arg k "$key" '.[$k]' "$MANIFEST")"
            check_status "/wp-content/themes/pgds/assets/dist/${asset}" 200
          done

          exit "$fail"

      # ---------------------------------------------------------------------
      # Revoke the temporary SSH rule.
      #
      # if: always() so the rule is removed even when the deploy, the reload, or the
      # Cloudflare purge failed. Without always(), a failed release promotion would leave port 22 open
      # to a runner IP indefinitely — and the next run would then hit AWS's
      # InvalidPermission.Duplicate on a stale rule, so the failure compounds.
      #
      # continue-on-error so a revoke hiccup cannot mask the real deploy result; the step
      # still logs loudly, and the guard below turns a leaked rule into a visible warning
      # rather than a silent one.
      # ---------------------------------------------------------------------
      - name: Revoke SSH for this runner
        if: always() && steps.open_ssh.outputs.runner_cidr != ''
        continue-on-error: true
        shell: bash
        env:
          SG_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.open_ssh.outputs.runner_cidr }}
          RULE_ID: ${{ steps.open_ssh.outputs.rule_id }}
          RULE_DESCRIPTION: ${{ steps.open_ssh.outputs.rule_description }}
        run: |
          set -uo pipefail

          # Prefer the immutable rule ID returned by authorize. If the open step failed
          # after AWS created the rule but before it published that output, recover only
          # this run's uniquely described rule instead of revoking by CIDR.
          RULE_IDS="$RULE_ID"
          if [ -z "$RULE_IDS" ] && [ -n "$RULE_DESCRIPTION" ]; then
            RULE_IDS="$(
              aws ec2 describe-security-group-rules \
                --filters "Name=group-id,Values=${SG_ID}" \
                --query "SecurityGroupRules[?IsEgress==\`false\` && Description=='${RULE_DESCRIPTION}'].SecurityGroupRuleId" \
                --output text 2>/dev/null || true
            )"
          fi

          if [ -z "$RULE_IDS" ]; then
            echo "::warning::no temporary SSH rule ID was available for ${RUNNER_CIDR}"
          fi
          for rule_id in $RULE_IDS; do
            if aws ec2 revoke-security-group-ingress \
                 --group-id "$SG_ID" \
                 --security-group-rule-ids "$rule_id" \
                 >/dev/null 2>&1; then
              echo "revoked ${rule_id} for ${RUNNER_CIDR}"
            else
              echo "::warning::could not revoke ${rule_id} on ${SG_ID} — remove it by hand"
            fi
          done

          # Report any deploy rule still present, so a leak is visible in the run summary
          # instead of only in the console weeks later. Query security-group rules directly;
          # nested IpPermissions projections can silently return an empty list.
          LEFT="$(
            aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${SG_ID}" \
              --query "SecurityGroupRules[?IsEgress==\`false\` && FromPort==\`22\` && ToPort==\`22\` && (Description=='github-actions temporary deploy access' || starts_with(Description || '', 'github-actions deploy '))].[SecurityGroupRuleId,CidrIpv4]" \
              --output text 2>/dev/null || true
          )"
          if [ -n "${LEFT:-}" ]; then
            echo "::warning::temporary deploy rules still on ${SG_ID}: ${LEFT}"
          else
            echo "no temporary deploy rules remain"
          fi
