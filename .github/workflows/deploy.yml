name: Deploy theme

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pgds-production-deploy
  cancel-in-progress: false

jobs:
  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PHP runs directly on the GitHub-hosted runner. The Docker-only PHP rule in
      # CLAUDE.md applies to the local development machine, which has no PHP binary.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint theme and mu-plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/pgds wp-content/mu-plugins \
            -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Lint JavaScript
        working-directory: wp-content/themes/pgds
        run: npm run lint:js

  build:
    name: Build theme assets
    needs:
      - lint-php
      - lint-js
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Verify built assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';

          const dist = 'wp-content/themes/pgds/assets/dist';
          const manifestPath = `${dist}/manifest.json`;

          if (!existsSync(manifestPath)) {
            throw new Error('Build did not create assets/dist/manifest.json.');
          }

          let manifest;
          try {
            manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          } catch (error) {
            throw new Error(`assets/dist/manifest.json is invalid JSON: ${error.message}`);
          }

          const files = readdirSync(dist);
          const required = [
            ['main CSS', /^main\.[a-f0-9]{8}\.css$/],
            ['app JavaScript', /^app\.[a-f0-9]{8}\.js$/],
          ];

          for (const [label, pattern] of required) {
            if (!files.some((file) => pattern.test(file))) {
              throw new Error(`Build did not create a hashed ${label} file.`);
            }
          }

          for (const key of ['main.css', 'app.js']) {
            if (typeof manifest[key] !== 'string' || !files.includes(manifest[key])) {
              throw new Error(`Manifest entry ${key} is missing or does not reference a built file.`);
            }
          }
          NODE

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # id-token is what lets this job exchange a GitHub OIDC token for the AWS role in
    # infra/terraform/main/github-oidc.tf. Without it the AWS step fails with
    # "Credentials could not be loaded"; with it, no long-lived AWS key exists in GitHub.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/pgds/package-lock.json

      - name: Install dependencies
        working-directory: wp-content/themes/pgds
        run: npm ci

      - name: Fetch self-hosted fonts
        working-directory: wp-content/themes/pgds
        run: npm run fonts

      - name: Build production assets
        working-directory: wp-content/themes/pgds
        run: npm run build

      - name: Configure deploy SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------------------
      # Temporary SSH access for this runner only.
      #
      # §10.2 restricts SSH ingress to one administrator CIDR, and a GitHub-hosted runner
      # is never at that address. The first real deploy proved it:
      #   ssh: connect to host *** port 22: Connection timed out
      #
      # Allow-listing GitHub's ranges is not an option — https://api.github.com/meta lists
      # 5,625 IPv4 ranges for `actions`, against AWS's default 60 rules per security group.
      # Opening 0.0.0.0/0 would throw away the §10.2 control outright.
      #
      # So the job opens a /32 for its own address, deploys, and revokes it in an always()
      # step below. Credentials come from OIDC (see infra/terraform/main/github-oidc.tf),
      # so no long-lived AWS key is stored in GitHub, and the role can do nothing but
      # authorize/revoke ingress on this one security group.
      # ---------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open SSH for this runner
        id: open_ssh
        shell: bash
        env:
          SG_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          # A previous job can be killed after authorizing ingress but before its always()
          # cleanup runs. Deploys are serialized, so no matching rule can belong to another
          # active deploy; remove any legacy leak before opening this run's rule.
          STALE_RULE_IDS="$(
            aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${SG_ID}" \
              --query "SecurityGroupRules[?IsEgress==\`false\` && FromPort==\`22\` && ToPort==\`22\` && (Description=='github-actions temporary deploy access' || starts_with(Description || '', 'github-actions deploy '))].SecurityGroupRuleId" \
              --output text
          )"
          for rule_id in $STALE_RULE_IDS; do
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" \
              --security-group-rule-ids "$rule_id" \
              >/dev/null
            echo "removed stale temporary SSH rule ${rule_id}"
          done

          # api.ipify.org is a plain-text echo; checkip.amazonaws.com is the fallback so a
          # single provider outage cannot block a deploy. Force IPv4 because this workflow
          # deliberately authorizes an IPv4 /32 and the origin has no public IPv6 address.
          RUNNER_IP="$(
            { curl -4fsS --max-time 15 https://api.ipify.org || \
              curl -4fsS --max-time 15 https://checkip.amazonaws.com; } |
              tr -d '[:space:]'
          )"
          if ! python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit(f"expected an IPv4 address, got {address}")
          PY
          then
            echo "could not determine the runner's public IPv4 address" >&2
            exit 1
          fi

          RUNNER_CIDR="${RUNNER_IP}/32"
          RULE_DESCRIPTION="github-actions deploy ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "runner_cidr=${RUNNER_CIDR}" >> "$GITHUB_OUTPUT"
          echo "rule_description=${RULE_DESCRIPTION}" >> "$GITHUB_OUTPUT"

          RULE_ID="$(
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_CIDR},Description='${RULE_DESCRIPTION}'}]" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text
          )"
          if [[ ! "$RULE_ID" =~ ^sgr-[0-9a-f]+$ ]]; then
            echo "AWS did not return the temporary security-group rule ID" >&2
            exit 1
          fi
          echo "rule_id=${RULE_ID}" >> "$GITHUB_OUTPUT"
          echo "opened 22 for ${RUNNER_CIDR} as ${RULE_ID}"

      - name: Deploy runtime theme files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_THEME_PATH: ${{ secrets.DEPLOY_THEME_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='tools/' \
            --exclude='build.mjs' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='eslint.config.mjs' \
            --exclude='README.md' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            wp-content/themes/pgds/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_THEME_PATH}/"

      - name: Reload PHP-FPM and flush FastCGI cache
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PHP_FPM_SERVICE: ${{ secrets.DEPLOY_PHP_FPM_SERVICE }}
          DEPLOY_FASTCGI_CACHE_DIR: ${{ secrets.DEPLOY_FASTCGI_CACHE_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo systemctl reload '${DEPLOY_PHP_FPM_SERVICE}' && sudo find '${DEPLOY_FASTCGI_CACHE_DIR}' -type f -delete"

      # Purge the origin before the edge. Purging Cloudflare first can re-cache stale
      # origin content at the edge, so only purge it after PHP-FPM and FastCGI are fresh.
      # Detect asset changes from the SOURCES, not from assets/.
      #
      # `git diff -- wp-content/themes/pgds/assets/` could not work: assets/dist/* is
      # gitignored (see .gitignore), so exactly ONE file is tracked under assets/ —
      # fonts/README.md. The condition was therefore false on essentially every deploy and
      # the edge purge below never ran, which is the one step that makes a new
      # [contenthash] filename reachable through Cloudflare.
      #
      # The sources that determine the built output are the SCSS/JS under src/, the build
      # script, and the dependency lockfile (a dart-sass or esbuild bump changes the
      # output). Comparing those is also more accurate than comparing the artefacts: the
      # hash changes if and only if the input did.
      #
      # `git diff --quiet` exits 1 when there are differences, which `set -e` would treat
      # as a failure, hence the explicit `if`.
      - name: Detect asset changes
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=(
            "wp-content/themes/pgds/src"
            "wp-content/themes/pgds/build.mjs"
            "wp-content/themes/pgds/package-lock.json"
            "wp-content/themes/pgds/assets/fonts"
          )
          # A first commit on a branch has no HEAD^; treat that as "assets changed" so the
          # purge errs toward correctness rather than serving a stale edge.
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "no HEAD^ (initial or shallow); assuming assets changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^ HEAD -- "${SOURCES[@]}"; then
            echo "asset sources unchanged; skipping edge purge"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "asset sources changed:"
            git diff --name-only HEAD^ HEAD -- "${SOURCES[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare when assets changed
        if: steps.assets.outputs.changed == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"purge_everything":true}'

      # ---------------------------------------------------------------------
      # Revoke the temporary SSH rule.
      #
      # if: always() so the rule is removed even when the deploy, the reload, or the
      # Cloudflare purge failed. Without always(), a failing rsync would leave port 22 open
      # to a runner IP indefinitely — and the next run would then hit AWS's
      # InvalidPermission.Duplicate on a stale rule, so the failure compounds.
      #
      # continue-on-error so a revoke hiccup cannot mask the real deploy result; the step
      # still logs loudly, and the guard below turns a leaked rule into a visible warning
      # rather than a silent one.
      # ---------------------------------------------------------------------
      - name: Revoke SSH for this runner
        if: always() && steps.open_ssh.outputs.runner_cidr != ''
        continue-on-error: true
        shell: bash
        env:
          SG_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.open_ssh.outputs.runner_cidr }}
          RULE_ID: ${{ steps.open_ssh.outputs.rule_id }}
          RULE_DESCRIPTION: ${{ steps.open_ssh.outputs.rule_description }}
        run: |
          set -uo pipefail

          # Prefer the immutable rule ID returned by authorize. If the open step failed
          # after AWS created the rule but before it published that output, recover only
          # this run's uniquely described rule instead of revoking by CIDR.
          RULE_IDS="$RULE_ID"
          if [ -z "$RULE_IDS" ] && [ -n "$RULE_DESCRIPTION" ]; then
            RULE_IDS="$(
              aws ec2 describe-security-group-rules \
                --filters "Name=group-id,Values=${SG_ID}" \
                --query "SecurityGroupRules[?IsEgress==\`false\` && Description=='${RULE_DESCRIPTION}'].SecurityGroupRuleId" \
                --output text 2>/dev/null || true
            )"
          fi

          if [ -z "$RULE_IDS" ]; then
            echo "::warning::no temporary SSH rule ID was available for ${RUNNER_CIDR}"
          fi
          for rule_id in $RULE_IDS; do
            if aws ec2 revoke-security-group-ingress \
                 --group-id "$SG_ID" \
                 --security-group-rule-ids "$rule_id" \
                 >/dev/null 2>&1; then
              echo "revoked ${rule_id} for ${RUNNER_CIDR}"
            else
              echo "::warning::could not revoke ${rule_id} on ${SG_ID} — remove it by hand"
            fi
          done

          # Report any deploy rule still present, so a leak is visible in the run summary
          # instead of only in the console weeks later. Query security-group rules directly;
          # nested IpPermissions projections can silently return an empty list.
          LEFT="$(
            aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=${SG_ID}" \
              --query "SecurityGroupRules[?IsEgress==\`false\` && FromPort==\`22\` && ToPort==\`22\` && (Description=='github-actions temporary deploy access' || starts_with(Description || '', 'github-actions deploy '))].[SecurityGroupRuleId,CidrIpv4]" \
              --output text 2>/dev/null || true
          )"
          if [ -n "${LEFT:-}" ]; then
            echo "::warning::temporary deploy rules still on ${SG_ID}: ${LEFT}"
          else
            echo "no temporary deploy rules remain"
          fi
