# =============================================================================
# LOCAL DEV environment to verify the pgds theme (NOT production).
# Production uses Nginx FastCGI cache (infra/nginx/); this local setup uses the
# Apache image for simplicity - just to run + view the 11 rendered blocks + import sample data.
#
# Run:   cd infra/local && docker compose up -d
# Then:  docker compose run --rm wpcli /scripts/setup.sh
# Open:  http://localhost:8080
# =============================================================================

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppw
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppw
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE_KEY_SALT', 'pgds:');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      # NOTE: the theme, mu-plugins, tools, and scripts are NOT bind-mounted. Bind
      # mounts resolve on the DOCKER DAEMON's filesystem, which is remote in this
      # dev environment (DOCKER_HOST=tcp://...), so they mount empty and the theme
      # appears absent. `./sync.sh` pushes them in over the API instead. Run it
      # after `docker compose up -d` and after every edit.
      - wp_core:/var/www/html

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppw
      WORDPRESS_DB_NAME: wordpress
    volumes:
      # Same reason as the wordpress service: no bind mounts. Everything arrives
      # through the shared wp_core volume, which ./sync.sh populates. The scripts
      # live at /var/www/html/.pgds-scripts and tools at /var/www/html/.pgds-tools.
      - wp_core:/var/www/html
    entrypoint: ["sh"]
    profiles: ["cli"]

volumes:
  db_data:
  wp_core:
