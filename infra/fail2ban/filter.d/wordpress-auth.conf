# fail2ban filter for WordPress login brute force (Proposal 02 §10.2).
#
# Matches POSTs to wp-login.php and xmlrpc.php in the Nginx access log. This is a
# request-rate filter, not an authentication-failure filter: WordPress does not log
# failed logins to the webserver log, and a successful login is indistinguishable from
# a failed one there (both are a 200 or a 302).
#
# The consequence is deliberate and must be understood before tuning maxretry: a
# legitimate editor who mistypes a password several times WILL be counted. maxretry is
# therefore set generously in jail.d/wordpress.conf (see the comment there), and
# WordPress's own Two Factor plugin (§8) is what actually defends the account.
#
# §10.2 also notes Cloudflare's free WAF rule count is very limited, so fail2ban at the
# origin "takes responsibility" for this.

[Definition]

# Nginx combined log format. <HOST> is fail2ban's IP placeholder.
#
# IMPORTANT: behind Cloudflare the origin sees CLOUDFLARE's IP, not the visitor's, so
# this filter would ban Cloudflare edge nodes and take the whole site off the internet.
# Nginx must be configured with real_ip_header CF-Connecting-IP and set_real_ip_from
# for Cloudflare's ranges BEFORE this jail is enabled in production. Until then, keep
# the jail on a long findtime/short bantime and watch it.
failregex = ^<HOST> -.*"POST /wp-login\.php.*$
            ^<HOST> -.*"POST /xmlrpc\.php.*$

ignoreregex =

# Nginx writes its timestamp in the standard combined format.
datepattern = ^[^\[]*\[({DATE})
