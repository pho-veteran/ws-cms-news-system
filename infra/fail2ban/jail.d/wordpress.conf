# fail2ban jail for WordPress login brute force (Proposal 02 §10.2).
#
# Install:
#   cp infra/fail2ban/filter.d/wordpress-auth.conf /etc/fail2ban/filter.d/
#   cp infra/fail2ban/jail.d/wordpress.conf        /etc/fail2ban/jail.d/
#   fail2ban-client reload
#   fail2ban-client status wordpress-auth
#
# READ THE WARNING in filter.d/wordpress-auth.conf before enabling in production:
# behind Cloudflare the origin sees Cloudflare's IPs, so without real_ip configuration
# this jail bans the CDN and takes the site offline.

[wordpress-auth]
enabled  = true
port     = http,https
filter   = wordpress-auth
logpath  = /var/log/nginx/access.log
backend  = auto

# The filter counts login REQUESTS, not failures — WordPress does not log auth failures
# to the webserver log (see the filter's header). So maxretry has to tolerate a human
# mistyping a password a few times, plus the browser re-POSTing on reload.
# 20 attempts in 10 minutes is far above human error and far below a useful brute force.
maxretry = 20
findtime = 600

# One hour, not permanent. A permanent ban on a request-rate signal eventually locks out
# an editor on a shared or CGNAT address, and the operator only finds out when they
# cannot publish. Two Factor (§8) is the real account defence; this is rate limiting.
bantime  = 3600

# Never ban ourselves or the private range the restore drill uses.
ignoreip = 127.0.0.1/8 ::1 172.31.0.0/16
