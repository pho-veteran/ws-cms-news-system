# =============================================================================
# Nginx server block for the pgds origin (proposal §5, §9.4)
# LEMP: Nginx + PHP-FPM 8.3. FastCGI page cache on DISK (not tmpfs).
#
# THIS FILE MIRRORS THE RUNNING ORIGIN. It was reconciled from the served config
# on 2026-09-02; keep them in step. `lifecycle.ignore_changes = [user_data]` plus a
# first-boot-only bootstrap means Terraform does NOT deploy this file — it is applied
# by hand, so the repo drifts silently unless someone copies it back.
#
# Install:
#   sudo install -m 0644 pgds.conf /etc/nginx/sites-available/pgds.conf
#   sudo ln -sfn /etc/nginx/sites-available/pgds.conf /etc/nginx/sites-enabled/pgds.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TRAP FOUND 2026-09-02: on the live origin, sites-enabled/pgds.conf is a REGULAR
# FILE, not a symlink, and its contents had diverged from sites-available. nginx
# serves sites-enabled, so editing sites-available changed nothing. After installing
# this file, confirm the symlink actually points where you think:
#   readlink -f /etc/nginx/sites-enabled/pgds.conf
# =============================================================================

# --- FastCGI cache zone (declared in http{} context; kept here for reference) --
# Placing it inside server{} will error -> move the 2 lines below into /etc/nginx/nginx.conf http{}:
#   fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WP:32m inactive=12h max_size=1g;
#   fastcgi_cache_key  "$scheme$request_method$host$request_uri";

# --- 301 redirect from old URLs (§9.4) ---------------------------------------
# The map file is generated by:  wp pgds build-redirects --out=/etc/nginx/redirects.map
#
# `include` is a HARD dependency: nginx refuses to start if the file is absent —
#   [emerg] open() "/etc/nginx/redirects.map" failed (2: No such file or directory)
# — so deploying this config before the import has generated the map takes the origin
# down rather than merely losing the redirects. Verified against nginx 1.24.0.
#
# Create an empty placeholder as part of provisioning so the ordering cannot bite:
#   touch /etc/nginx/redirects.map
# An empty map is valid and simply matches nothing. user_data.sh does this on first
# boot; keep it if you rebuild the origin by hand.
map $request_uri $pgds_redirect {
    include /etc/nginx/redirects.map;
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80;
    # TLS terminates here for Cloudflare Full (strict). The certificate is Let's
    # Encrypt via DNS-01, auto-renewed by the certbot cron job — NOT the Cloudflare
    # Origin CA certificate proposal §5.3 specified. Either satisfies Full (strict);
    # Let's Encrypt was chosen because certbot already automates renewal, where an
    # Origin CA cert is a manual 15-year key to rotate by hand. Recorded so nobody
    # "corrects" it back and breaks renewal.
    #
    # `listen ... http2` is the ONLY form that works here. nginx 1.24.0 does not know
    # the standalone `http2 on;` directive — that arrived in 1.25.1 — and rejects it:
    #   [emerg] unknown directive "http2"
    # Verified by testing it against this origin on 2026-09-02. Do not "modernise"
    # this line without first confirming the installed nginx version.
    listen 443 ssl http2;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/vihn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vihn.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    server_name _;

    root /var/www/pgds;
    index index.php;

    # --- Origin verification (§10.2) — DELIBERATELY DISABLED, read before enabling ---
    # Proposal §10.2 wants two independent barriers against direct-origin access:
    #   1. the security group, which admits :80/:443 from Cloudflare ranges ONLY
    #   2. this secret header, injected by a Cloudflare Transform Rule
    # Only (1) is deployed. Verified 2026-09-02: `curl http://3.1.122.66/` from outside
    # a Cloudflare range times out, so the origin is not currently exposed.
    #
    # ENABLING THIS IS A TWO-SIDED CHANGE AND THE ORDER MATTERS. The Cloudflare
    # Transform Rule must exist and be injecting the header BEFORE the line below is
    # uncommented. Uncomment it first and every request — including Cloudflare's —
    # gets a 403: a total outage, and one that looks like an origin failure rather
    # than a config change.
    #
    #   1. Cloudflare > Rules > Transform Rules > Modify Request Header:
    #        set static  X-Origin-Verify: <secret>
    #   2. Confirm the header is arriving (origin access log, or a temporary
    #      `add_header X-Seen-Verify $http_x_origin_verify always;`)
    #   3. Only then uncomment, `nginx -t`, reload
    #   4. Re-verify the site still serves 200 through the edge
    #
    # The secret does not belong in this file — it is committed to git. Put it in an
    # untracked include (/etc/nginx/conf.d/pgds-origin-secret.conf) and reference the
    # variable here.
    # if ($http_x_origin_verify != "<secret>") { return 403; }

    # --- 301 redirect for old posts ---
    if ($pgds_redirect != "") {
        return 301 $pgds_redirect;
    }

    # --- Cache bypass conditions ---
    set $skip 0;
    if ($request_method = POST)  { set $skip 1; }
    if ($arg_s != "")            { set $skip 1; }
    if ($arg_preview != "")      { set $skip 1; }
    if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-json/|/wp-cron\.php|/xmlrpc\.php") { set $skip 1; }
    if ($http_cookie ~* "wordpress_logged_in_|wp-postpass_|comment_author_") { set $skip 1; }

    # --- Static asset: cache 1 year + immutable (filename has hash) ---
    location ~* \.(css|js|woff2|woff|ttf|webp|avif|jpg|jpeg|png|gif|svg|ico)$ {
        # NOTE: no `expires 1y;` here. `expires` emits its OWN Cache-Control, so
        # pairing it with add_header sent the header TWICE:
        #   Cache-Control: max-age=31536000
        #   Cache-Control: public, max-age=31536000, immutable
        # Which one a cache honours is then implementation-dependent, and the
        # `immutable` in §5.5 is exactly the token that must not be the one dropped.
        # Verified against nginx 1.24.0 on the origin.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- HTML: no-cache (revalidate) at browser; cached at FastCGI ---
    # The add_header here does NOT cover rendered pages. try_files internally
    # redirects to /index.php, which is then served by `location ~ \.php$` — and
    # add_header does not inherit into the location that actually produces the
    # response. Measured: the front page shipped with NO Cache-Control at all, so
    # browsers were free to heuristically cache HTML and §5.5's whole point ("if a
    # visitor's browser caches HTML, a server purge is meaningless to that visitor")
    # was lost. The header is therefore ALSO set in the PHP location below; this one
    # remains for static files served straight from disk under /.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.php?$args;
    }

    # =========================================================================
    # DENY RULES MUST COME BEFORE `location ~ \.php$`.
    #
    # nginx evaluates regex locations in FILE ORDER and stops at the FIRST match.
    # These blocks originally sat at the bottom of the file, after the PHP handler,
    # so every one of them that targets a .php path was dead code: the PHP location
    # matched first and handed the request to php-fpm.
    #
    # Measured before the fix (nginx 1.24.0):
    #   /wp-config.php                -> 200  (should be 403)
    #   /wp-content/uploads/t/x.php   -> 200  (should be 403) <- executed the upload
    #
    # The wp-config.php case leaked nothing by luck (it defines constants and exits
    # with no output), but the uploads case is a live remote-code-execution path: any
    # attacker who gets a .php file into the media library gets it executed. This is
    # the single most important ordering constraint in the file — do not move these
    # blocks back down.
    # =========================================================================

    # Block PHP execution in uploads. First, because it is the RCE vector.
    location ~* /wp-content/uploads/.*\.php$ { deny all; }

    # Sensitive files.
    location ~* /(?:wp-config\.php|\.ht|readme\.html|license\.txt)$ { deny all; }

    # Dotfiles (.git, .env, .svn ...), except ACME's well-known challenge path.
    location ~ /\.(?!well-known).* { deny all; }

    # --- PHP + FastCGI cache ---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache        WP;
        fastcgi_cache_bypass $skip;
        fastcgi_no_cache     $skip;
        fastcgi_cache_valid  200 301 302 12h;
        fastcgi_cache_lock   on;
        # NOT "http_502": nginx rejects it for this directive and refuses to start
        #   nginx: [emerg] invalid value "http_502"
        # Proposal §5.3 specifies `error timeout http_500 http_502 http_503`, which
        # would have failed `nginx -t` on the first deploy. The directive accepts only
        # error | timeout | invalid_header | updating | http_500 | http_503 | http_403
        # | http_404 | http_429 | off — 502 and 504 are not in the list. Verified by
        # testing each token against nginx 1.24.0 on the origin.
        # The intent (serve stale when the upstream is broken) is preserved: a
        # php-fpm failure surfaces as error/timeout or 500, all of which are covered.
        fastcgi_cache_use_stale error timeout http_500 http_503;

        add_header X-Cache $upstream_cache_status always;

        # §5.5: "no-cache" means "cache but revalidate", not "do not cache" — with an
        # ETag a revalidation is a cheap 304. It must be set HERE, not only in
        # `location /`, because this is the location that actually renders HTML;
        # add_header does not inherit across the internal redirect from try_files.
        # Without it the browser is free to heuristically cache the page, and the
        # editor's "changes are visible immediately" guarantee dies at the last hop.
        add_header Cache-Control "no-cache" always;
    }

    # NOTE: the deny rules deliberately live ABOVE the PHP location, not here. See the
    # comment block there — placed after it they never match a .php request.
}
