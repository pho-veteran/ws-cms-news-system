# =============================================================================
# Nginx server block for phatgiaovadoisong.vn (proposal §5, §9.4)
# LEMP: Nginx + PHP-FPM 8.3. FastCGI page cache on DISK (not tmpfs).
# File location: /etc/nginx/sites-available/pgds.conf  ->  symlink sites-enabled/
# =============================================================================

# --- FastCGI cache zone (declared in http{} context; kept here for reference) --
# Placing it inside server{} will error -> move the 2 lines below into /etc/nginx/nginx.conf http{}:
#   fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WP:32m inactive=12h max_size=1g;
#   fastcgi_cache_key  "$scheme$request_method$host$request_uri";

# --- 301 redirect from old URLs (§9.4) ---------------------------------------
# The map file is generated by:  wp pgds build-redirects --out=/etc/nginx/redirects.map
#
# `include` is a HARD dependency: nginx refuses to start if the file is absent —
#   [emerg] open() "/etc/nginx/redirects.map" failed (2: No such file or directory)
# — so deploying this config before the import has generated the map takes the origin
# down rather than merely losing the redirects. Verified against nginx 1.24.0.
#
# Create an empty placeholder as part of provisioning so the ordering cannot bite:
#   touch /etc/nginx/redirects.map
# An empty map is valid and simply matches nothing. user_data.sh does this on first
# boot; keep it if you rebuild the origin by hand.
map $request_uri $pgds_redirect {
    include /etc/nginx/redirects.map;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name phatgiaovadoisong.vn www.phatgiaovadoisong.vn;

    root /var/www/pgds;
    index index.php;

    # Only allow CloudFront/Cloudflare to call the origin: check a secret header (set at the edge).
    # if ($http_x_origin_verify != "DAT_MOT_CHUOI_BI_MAT") { return 403; }

    # --- 301 redirect for old posts ---
    if ($pgds_redirect != "") {
        return 301 $pgds_redirect;
    }

    # --- Cache bypass conditions ---
    set $skip 0;
    if ($request_method = POST)  { set $skip 1; }
    if ($arg_s != "")            { set $skip 1; }
    if ($arg_preview != "")      { set $skip 1; }
    if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-json/|/wp-cron\.php|/xmlrpc\.php") { set $skip 1; }
    if ($http_cookie ~* "wordpress_logged_in_|wp-postpass_|comment_author_") { set $skip 1; }

    # --- Static asset: cache 1 year + immutable (filename has hash) ---
    location ~* \.(css|js|woff2|woff|ttf|webp|avif|jpg|jpeg|png|gif|svg|ico)$ {
        # NOTE: no `expires 1y;` here. `expires` emits its OWN Cache-Control, so
        # pairing it with add_header sent the header TWICE:
        #   Cache-Control: max-age=31536000
        #   Cache-Control: public, max-age=31536000, immutable
        # Which one a cache honours is then implementation-dependent, and the
        # `immutable` in §5.5 is exactly the token that must not be the one dropped.
        # Verified against nginx 1.24.0 on the origin.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- HTML: no-cache (revalidate) at browser; cached at FastCGI ---
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.php?$args;
    }

    # =========================================================================
    # DENY RULES MUST COME BEFORE `location ~ \.php$`.
    #
    # nginx evaluates regex locations in FILE ORDER and stops at the FIRST match.
    # These blocks originally sat at the bottom of the file, after the PHP handler,
    # so every one of them that targets a .php path was dead code: the PHP location
    # matched first and handed the request to php-fpm.
    #
    # Measured before the fix (nginx 1.24.0):
    #   /wp-config.php                -> 200  (should be 403)
    #   /wp-content/uploads/t/x.php   -> 200  (should be 403) <- executed the upload
    #
    # The wp-config.php case leaked nothing by luck (it defines constants and exits
    # with no output), but the uploads case is a live remote-code-execution path: any
    # attacker who gets a .php file into the media library gets it executed. This is
    # the single most important ordering constraint in the file — do not move these
    # blocks back down.
    # =========================================================================

    # Block PHP execution in uploads. First, because it is the RCE vector.
    location ~* /wp-content/uploads/.*\.php$ { deny all; }

    # Sensitive files.
    location ~* /(?:wp-config\.php|\.ht|readme\.html|license\.txt)$ { deny all; }

    # Dotfiles (.git, .env, .svn ...), except ACME's well-known challenge path.
    location ~ /\.(?!well-known).* { deny all; }

    # --- PHP + FastCGI cache ---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache        WP;
        fastcgi_cache_bypass $skip;
        fastcgi_no_cache     $skip;
        fastcgi_cache_valid  200 301 302 12h;
        fastcgi_cache_lock   on;
        # NOT "http_502": nginx rejects it for this directive and refuses to start
        #   nginx: [emerg] invalid value "http_502"
        # Proposal §5.3 specifies `error timeout http_500 http_502 http_503`, which
        # would have failed `nginx -t` on the first deploy. The directive accepts only
        # error | timeout | invalid_header | updating | http_500 | http_503 | http_403
        # | http_404 | http_429 | off — 502 and 504 are not in the list. Verified by
        # testing each token against nginx 1.24.0 on the origin.
        # The intent (serve stale when the upstream is broken) is preserved: a
        # php-fpm failure surfaces as error/timeout or 500, all of which are covered.
        fastcgi_cache_use_stale error timeout http_500 http_503;

        add_header X-Cache $upstream_cache_status always;
    }

    # NOTE: the deny rules deliberately live ABOVE the PHP location, not here. See the
    # comment block there — placed after it they never match a .php request.
}
