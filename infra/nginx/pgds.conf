# =============================================================================
# Nginx server block cho phatgiaovadoisong.vn (proposal §5, §9.4)
# LEMP: Nginx + PHP-FPM 8.3. FastCGI page cache tren DISK (khong tmpfs).
# Dat file: /etc/nginx/sites-available/pgds.conf  ->  symlink sites-enabled/
# =============================================================================

# --- FastCGI cache zone (khai bao o http{} context; de o day de tham chieu) --
# Neu dat trong server{} se loi -> chuyen 2 dong duoi vao /etc/nginx/nginx.conf http{}:
#   fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WP:32m inactive=12h max_size=1g;
#   fastcgi_cache_key  "$scheme$request_method$host$request_uri";

# --- Redirect 301 tu URL cu (sinh boi: wp pgds build-redirects) --------------
map $request_uri $pgds_redirect {
    include /etc/nginx/redirects.map;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name phatgiaovadoisong.vn www.phatgiaovadoisong.vn;

    root /var/www/pgds;
    index index.php;

    # Chi CloudFront/Cloudflare goi origin: kiem header bi mat (dat o edge).
    # if ($http_x_origin_verify != "DAT_MOT_CHUOI_BI_MAT") { return 403; }

    # --- 301 redirect bai cu ---
    if ($pgds_redirect != "") {
        return 301 $pgds_redirect;
    }

    # --- Bo qua cache: dieu kien ---
    set $skip 0;
    if ($request_method = POST)  { set $skip 1; }
    if ($arg_s != "")            { set $skip 1; }
    if ($arg_preview != "")      { set $skip 1; }
    if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-json/|/wp-cron\.php|/xmlrpc\.php") { set $skip 1; }
    if ($http_cookie ~* "wordpress_logged_in_|wp-postpass_|comment_author_") { set $skip 1; }

    # --- Static asset: cache 1 nam + immutable (filename co hash) ---
    location ~* \.(css|js|woff2|woff|ttf|webp|avif|jpg|jpeg|png|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- HTML: no-cache (revalidate) o browser; cache o FastCGI ---
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP + FastCGI cache ---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_cache        WP;
        fastcgi_cache_bypass $skip;
        fastcgi_no_cache     $skip;
        fastcgi_cache_valid  200 301 302 12h;
        fastcgi_cache_lock   on;
        fastcgi_cache_use_stale error timeout http_500 http_502 http_503;

        add_header X-Cache $upstream_cache_status always;
    }

    # --- Chan truy cap file nhay cam ---
    location ~* /(?:wp-config\.php|\.ht|readme\.html|license\.txt)$ { deny all; }
    location ~ /\.(?!well-known).* { deny all; }

    # Chan thuc thi PHP trong uploads (phong upload doc hai).
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
}
