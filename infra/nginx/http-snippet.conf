# =============================================================================
# Dan 2 dong nay vao khoi http { } trong /etc/nginx/nginx.conf
# (fastcgi_cache_path va fastcgi_cache_key phai o http context, khong o server).
# Cache tren DISK, KHONG tmpfs (proposal §5.3, §5.8: tmpfs an vao 2GB RAM).
# =============================================================================

fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WP:32m inactive=12h max_size=1g;
fastcgi_cache_key  "$scheme$request_method$host$request_uri";

# Nen Brotli/Gzip cho HTML + text (neu module co san):
# gzip on;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
# gzip_min_length 1024;
