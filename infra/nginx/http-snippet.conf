# =============================================================================
# Paste these 2 lines into the http { } block in /etc/nginx/nginx.conf
# (fastcgi_cache_path and fastcgi_cache_key must be in http context, not server).
# Cache on DISK, NOT tmpfs (proposal §5.3, §5.8: tmpfs would eat into the 2GB RAM).
# =============================================================================

fastcgi_cache_path /var/cache/nginx/fcgi levels=1:2 keys_zone=WP:32m inactive=12h max_size=1g;
fastcgi_cache_key  "$scheme$request_method$host$request_uri";

# Enable Brotli/Gzip for HTML + text (if the module is available):
# gzip on;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
# gzip_min_length 1024;
